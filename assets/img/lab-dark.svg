<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="27 -30 170 170" width="500" height="500"
     xmlns="http://www.w3.org/2000/svg" fill="none">

  <defs>
    <mask id="staff-erase" maskUnits="userSpaceOnUse">
      <rect x="-50" y="-100" width="400" height="400" fill="white"/>
      <rect x="94"    y="38" width="8"  height="12" fill="black"/>
      <rect x="136.5" y="56" width="7"  height="12" fill="black"/>
      <rect x="154"   y="74" width="20" height="12" fill="black"/>
    </mask>
  </defs>

  <!-- ══ CYBER SIDE — vertical chain (3) + one branch off the middle
       Main chain stays fully vertical at x=58. Branch circle
       sits down-and-right of the middle; angle from vertical
       arctan(13/28) ≈ 25° ("45° or even less"). ══ -->
  <g stroke="#B5C7DF">
    <circle cx="58" cy="38" r="5.5" stroke-width="1.6"/>
    <circle cx="58" cy="66" r="5.5" stroke-width="1.6"/>
    <circle cx="58" cy="94" r="5.5" stroke-width="1.6"/>
    <circle cx="71" cy="94" r="5.5" stroke-width="1.6"/>
    <line x1="58"   y1="43.5" x2="58"   y2="60.5" stroke-width="1.3"/>
    <line x1="58"   y1="71.5" x2="58"   y2="88.5" stroke-width="1.3"/>
    <line x1="60.3" y1="71.0" x2="68.7" y2="89.0" stroke-width="1.3"/>
  </g>

  <!-- ══ MEMBRANE ══ -->
  <g stroke="#ECE7DE">
    <line x1="82" y1="5" x2="82" y2="120"
          stroke-width="1" stroke-dasharray="3 5" opacity=".30"/>
  </g>

  <!-- ══ PHYSICAL FIELD — five-line staff with masked breaks ══ -->
  <g stroke="#E6CFA8" stroke-width="1.3" opacity=".75" mask="url(#staff-erase)">
    <path d="M 87,26  C 108,22  130,30  154,26  C 161,24  167,28  170,26"/>
    <path d="M 87,44  C 108,40  130,48  154,44  C 161,42  167,46  170,44"/>
    <path d="M 87,62  C 108,58  130,66  154,62  C 161,60  167,64  170,62"/>
    <path d="M 87,80  C 108,76  130,84  154,80  C 161,78  167,82  170,80"/>
    <path d="M 87,98  C 108,94  130,102 154,98  C 161,96  167,100 170,98"/>
  </g>

  <!-- ══ QUBIT BASIS LABELS ══ -->
  <g font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" fill="#E6CFA8">
    <text x="98"  y="48" text-anchor="middle" font-size="11" font-weight="500">0</text>
    <text x="140" y="66" text-anchor="middle" font-size="11" font-weight="500">1</text>
    <text x="164" y="84" text-anchor="middle" font-size="10" font-weight="500" font-style="italic">|ψ⟩</text>
  </g>

  <!-- ══ ACTUATION ARROW — circumflex (^) ══ -->
  <g stroke="#B5C7DF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 65,26 L 82,8 L 116,44"/>
    <path d="M 108.3,41.7 L 116,44 L 114.1,36.2"/>
  </g>

  <!-- ══ SENSING ARROW — horizontal right-to-left ══ -->
  <g stroke="#E6CFA8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="134" y1="71" x2="95" y2="71"/>
    <path d="M 101,67 L 95,71 L 101,75"/>
  </g>

  <!-- ══ AGENT NODE + 4 CPS APPENDAGES ══ -->

  <!-- NE — drone arm + rotor hub -->
  <g transform="translate(82,66) rotate(-45)" stroke="#ECE7DE" stroke-linecap="round">
    <line x1="7" y1="0" x2="15" y2="0" stroke-width="1.8"/>
    <circle cx="15" cy="0" r="2.8" fill="#ECE7DE" stroke="none"/>
  </g>

  <!-- NW — antenna mast + WiFi arcs -->
  <g transform="translate(82,66) rotate(-135)" stroke="#ECE7DE" stroke-linecap="round">
    <line x1="7" y1="0" x2="12" y2="0" stroke-width="1.4"/>
    <path d="M 12,-3.5 A 3.5,3.5 0 0 1 12,3.5"  stroke-width="1.3" fill="none"/>
    <path d="M 12,-5.8 A 5.8,5.8 0 0 1 12,5.8"  stroke-width="1.0" fill="none" opacity=".55"/>
  </g>

  <!-- SW — wheel / UGV -->
  <g transform="translate(82,66) rotate(135)" stroke="#ECE7DE" stroke-linecap="round">
    <line x1="7" y1="0" x2="12" y2="0" stroke-width="1.4"/>
    <circle cx="12" cy="0" r="4.5" stroke-width="1.4" fill="none"/>
    <circle cx="12" cy="0" r="1.6" fill="#ECE7DE" stroke="none"/>
  </g>

  <!-- SE — manipulator: extended anchor, forearm folded inward
       Anchor lengthened 5 → 7 (elbow at local (14,0)).
       Forearm rotated to angle 120° from +x (interior elbow
       angle = 60°, acute). Gripper tucked so the lower prong
       sits just above the y=79 line that grazes the SW wheel. -->
  <g transform="translate(82,66) rotate(45)" stroke="#ECE7DE" stroke-linecap="round">
    <line x1="7"  y1="0"   x2="14"   y2="0"    stroke-width="1.9"/>
    <circle cx="14" cy="0" r="2.1" fill="#ECE7DE" stroke="none"/>
    <line x1="14" y1="0"   x2="12"   y2="3.5"  stroke-width="1.6"/>
    <line x1="12" y1="3.5" x2="9.6"  y2="5.0"  stroke-width="1.2"/>
    <line x1="12" y1="3.5" x2="11.9" y2="6.3"  stroke-width="1.2"/>
  </g>

  <!-- agent body — caps the appendage roots -->
  <circle cx="82" cy="66" r="7" fill="#ECE7DE"/>

  <!-- ══ SMALLER AGENT — cross configuration, reversed roles
       Centered on the first staff gap (y=35), above-and-left
       of the "1" label. Body r=3 (~43% of main r=7), arms in
       + rather than × (rotated 45°). Each appendage is in the
       direction diametrically opposite its rotated equivalent:
         main NE drone     →  S
         main NW antenna   →  E
         main SW wheel     →  N
         main SE manipulator → W
       ══ -->
  <g transform="translate(130,35)">
    <!-- N (up) — wheel -->
    <g transform="rotate(-90)" stroke="#ECE7DE" stroke-linecap="round">
      <line x1="3" y1="0" x2="5" y2="0" stroke-width="0.7"/>
      <circle cx="5" cy="0" r="1.9" stroke-width="0.7" fill="none"/>
      <circle cx="5" cy="0" r="0.7" fill="#ECE7DE" stroke="none"/>
    </g>
    <!-- E (right) — antenna -->
    <g transform="rotate(0)" stroke="#ECE7DE" stroke-linecap="round">
      <line x1="3" y1="0" x2="5" y2="0" stroke-width="0.7"/>
      <path d="M 5,-1.5 A 1.5,1.5 0 0 1 5,1.5" stroke-width="0.6" fill="none"/>
      <path d="M 5,-2.5 A 2.5,2.5 0 0 1 5,2.5" stroke-width="0.5" fill="none" opacity=".55"/>
    </g>
    <!-- S (down) — drone -->
    <g transform="rotate(90)" stroke="#ECE7DE" stroke-linecap="round">
      <line x1="3" y1="0" x2="6.5" y2="0" stroke-width="0.9"/>
      <circle cx="6.5" cy="0" r="1.3" fill="#ECE7DE" stroke="none"/>
    </g>
    <!-- W (left) — manipulator (extended anchor + folded forearm, smaller) -->
    <g transform="rotate(180)" stroke="#ECE7DE" stroke-linecap="round">
      <line x1="3"   y1="0"   x2="5.5"  y2="0"    stroke-width="0.9"/>
      <circle cx="5.5" cy="0" r="0.9" fill="#ECE7DE" stroke="none"/>
      <line x1="5.5" y1="0"   x2="5"    y2="1.3"  stroke-width="0.7"/>
      <line x1="5"   y1="1.3" x2="4.0"  y2="2.0"  stroke-width="0.55"/>
      <line x1="5"   y1="1.3" x2="4.95" y2="2.3"  stroke-width="0.55"/>
    </g>
    <!-- smaller agent body -->
    <circle cx="0" cy="0" r="3" fill="#ECE7DE"/>
  </g>

</svg>
